<header class="app-navbar">
  <a class="nav-brand" routerLink="/home">BuildEase</a>
  <span class="nav-badge">{{ username | titlecase }} / Admin</span>

  <nav class="nav-links" aria-label="Admin navigation">
    <a routerLink="/home" routerLinkActive="active">Home</a>
    <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/admin/insights" routerLinkActive="active">Insights</a>

    <div class="nav-dropdown">
      <button type="button" class="nav-dropdown-toggle" aria-haspopup="true">Materials</button>
      <div class="nav-dropdown-menu">
        <a routerLink="/admin/material/add" routerLinkActive="active" (click)="onMenuItemClick()">Add Material</a>
        <a routerLink="/admin/materials" routerLinkActive="active" (click)="onMenuItemClick()">View Materials</a>
      </div>
    </div>

    <a routerLink="/admin/requests" routerLinkActive="active">Requests</a>
    <a routerLink="/admin/feedbacks" routerLinkActive="active">Feedbacks</a>

    <div class="nav-dropdown">
      <button type="button" class="nav-dropdown-toggle" aria-haspopup="true">Account</button>
      <div class="nav-dropdown-menu">
        <a routerLink="/profile" routerLinkActive="active" (click)="onMenuItemClick()">My Profile</a>
        <a routerLink="/admin/admins" routerLinkActive="active" (click)="onMenuItemClick()">Manage Admins</a>
      </div>
    </div>
    <button type="button" class="nav-logout" (click)="openLogoutModal()">Logout</button>
  </nav>
</header>

<div class="modal-backdrop" *ngIf="showLogoutModal">
  <div class="modal-box modal-small" role="dialog" aria-modal="true" aria-labelledby="adminLogoutText">
    <p id="adminLogoutText" class="logout-text">Are you sure you want to logout?</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-success logout-action" (click)="confirmLogout()">Yes, Logout</button>
      <button type="button" class="btn btn-danger logout-action" (click)="cancelLogout()">Cancel</button>
    </div>
  </div>
</div>
