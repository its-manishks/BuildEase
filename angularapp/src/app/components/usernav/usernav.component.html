<header class="app-navbar">
  <a class="nav-brand" routerLink="/home">BuildEase</a>

  <nav class="nav-links" aria-label="User navigation">
    <span class="nav-badge">{{ username | titlecase }} / User</span>
    <a routerLink="/home" routerLinkActive="active">Home</a>

    <div class="nav-dropdown">
      <button type="button" class="nav-dropdown-toggle" aria-haspopup="true">Materials</button>
      <div class="nav-dropdown-menu">
        <a routerLink="/user/materials" routerLinkActive="active" (click)="onMenuItemClick()">View Materials</a>
        <a routerLink="/user/requests" routerLinkActive="active" (click)="onMenuItemClick()">My Requests</a>
      </div>
    </div>

    <div class="nav-dropdown">
      <button type="button" class="nav-dropdown-toggle" aria-haspopup="true">Feedback</button>
      <div class="nav-dropdown-menu">
        <a routerLink="/user/feedbacks" routerLinkActive="active" (click)="onMenuItemClick()">My Feedbacks</a>
      </div>
    </div>

    <a routerLink="/profile" routerLinkActive="active">Profile</a>
    <button type="button" class="nav-logout" (click)="openLogoutModal()">Logout</button>
  </nav>
</header>

<div class="modal-backdrop" *ngIf="showLogoutModal">
  <div class="modal-box modal-small" role="dialog" aria-modal="true" aria-labelledby="userLogoutText">
    <p id="userLogoutText" class="logout-text">Are you sure you want to logout?</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-success logout-action" (click)="confirmLogout()">Yes, Logout</button>
      <button type="button" class="btn btn-danger logout-action" (click)="cancelLogout()">Cancel</button>
    </div>
  </div>
</div>
