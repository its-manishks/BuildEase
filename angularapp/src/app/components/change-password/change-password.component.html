<ng-container *ngIf="visible">
    <ng-template #formBody>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="pw-form">
        <label for="currentPassword">Current password</label>
        <input id="currentPassword" type="password" formControlName="currentPassword" autocomplete="current-password">
        <div class="error-text" *ngIf="invalid('currentPassword')">Current password is required</div>
  
        <label for="changeNewPassword">New password</label>
        <input id="changeNewPassword" type="password" formControlName="newPassword" autocomplete="new-password">
        <ul class="password-rules" aria-label="Password requirements">
          <li *ngFor="let rule of passwordRules" [class.ok]="rule.ok">{{ rule.label }}</li>
        </ul>
  
        <label for="changeConfirmPassword">Confirm new password</label>
        <input id="changeConfirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password">
        <div class="error-text" *ngIf="form.hasError('passwordMismatch') && submitted">Passwords do not match</div>
  
        <div class="error-text" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>
        <button type="submit" class="btn btn-primary pw-submit" [disabled]="busy">
          {{ busy ? 'Saving...' : 'Update password' }}
        </button>
      </form>
    </ng-template>
  
    <div *ngIf="!inline" class="modal-backdrop">
      <div class="modal-box pw-modal" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
        <h3 id="pwTitle" class="modal-title">Set a new password</h3>
        <p class="pw-intro">For security, the default password must be changed before you continue.</p>
        <ng-container *ngTemplateOutlet="formBody"></ng-container>
      </div>
    </div>
  
    <section *ngIf="inline" class="page-card pw-card" aria-labelledby="pwCardTitle">
      <h3 id="pwCardTitle" class="pw-card-title">Change password</h3>
      <ng-container *ngTemplateOutlet="formBody"></ng-container>
    </section>
  </ng-container>
