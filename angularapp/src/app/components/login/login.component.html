<div class="auth-page">
  <div class="auth-card">

    <div class="auth-banner">
      <h1 class="brand-title">BuildEase</h1>
    </div>

    <div class="auth-panel">
      <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <h2>Login</h2>

        <div class="form-field">
          <input id="identifier" type="text" formControlName="identifier" placeholder="Username or Email"
                 autocomplete="username">
          <div class="error-text" *ngIf="showError('identifier', 'required')">Username or email is required</div>
        </div>

        <div class="form-field">
          <div class="password-wrapper">
            <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                   placeholder="Password" autocomplete="current-password">
            <button type="button" class="toggle-password" (click)="togglePassword()"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor"
                      d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor"
                      d="M2.3 3.7 3.7 2.3l18 18-1.4 1.4-3.2-3.2A11.9 11.9 0 0 1 12 19c-5 0-9.3-3.1-11-7a12.3 12.3 0 0 1 4.1-5L2.3 3.7zM12 5c5 0 9.3 3.1 11 7a12.5 12.5 0 0 1-3.4 4.6l-3.2-3.2A4.5 4.5 0 0 0 10.6 7.6L8.4 5.4C9.5 5.1 10.7 5 12 5z"/>
              </svg>
            </button>
          </div>
          <div class="error-text" *ngIf="showError('password', 'required')">Password is required</div>
        </div>

        <p class="forgot-link"><a routerLink="/forgot-password">Forgot password?</a></p>

        <div class="error-text server-error" *ngIf="errorMessage" role="alert">
          {{ errorMessage }}
          <button *ngIf="unverifiedEmail" type="button" class="link-button" (click)="openVerification()">Verify now</button>
        </div>

        <button id="loginButton" type="submit" class="primary-button" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Logging in...' : 'Login' }}
        </button>

        <p class="switch-link">Don't have an account? <a routerLink="/signup">Signup</a></p>
      </form>
    </div>

  </div>
</div>

<app-otp-verification *ngIf="showVerification && unverifiedEmail" [email]="unverifiedEmail"
                      (verified)="onVerified()" (closed)="showVerification = false"></app-otp-verification>
