<section class="reset-page">
  <div class="reset-card">
    <h2>Reset your password</h2>

    <form *ngIf="step === 'request'" [formGroup]="requestForm" (ngSubmit)="sendCode()" novalidate>
      <p class="hint">Enter the email you signed up with. We'll send you a 6-digit code.</p>
      <label for="resetEmail">Email</label>
      <input id="resetEmail" type="email" formControlName="email" autocomplete="email">
      <div class="error-text" *ngIf="invalid(requestForm, 'email')">Enter a valid email</div>
      <div class="error-text" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>
      <button type="submit" class="btn btn-primary wide" [disabled]="busy">{{ busy ? 'Sending...' : 'Send code' }}</button>
    </form>

    <form *ngIf="step === 'reset'" [formGroup]="resetForm" (ngSubmit)="resetPassword()" novalidate>
      <p class="hint">{{ infoMessage }}</p>
      <p class="dev-code" *ngIf="devCode">Test mode code: <strong>{{ devCode }}</strong></p>

      <label for="resetCode">Code</label>
      <input id="resetCode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
             formControlName="code">
      <div class="error-text" *ngIf="invalid(resetForm, 'code')">Enter the 6-digit code</div>

      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password">
      <ul class="password-rules" aria-label="Password requirements">
        <li *ngFor="let rule of passwordRules" [class.ok]="rule.ok">{{ rule.label }}</li>
      </ul>

      <label for="confirmNewPassword">Confirm new password</label>
      <input id="confirmNewPassword" type="password" formControlName="confirmPassword" autocomplete="new-password">
      <div class="error-text" *ngIf="resetForm.hasError('passwordMismatch') && submitted">Passwords do not match</div>

      <div class="error-text" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>
      <button type="submit" class="btn btn-primary wide" [disabled]="busy">{{ busy ? 'Saving...' : 'Reset password' }}</button>

      <div class="secondary-actions">
        <button type="button" class="text-button" [disabled]="cooldown > 0 || busy" (click)="sendCode()">
          {{ cooldown > 0 ? 'Resend in ' + cooldown + 's' : 'Resend code' }}
        </button>
        <button type="button" class="text-button" (click)="useDifferentEmail()">Use a different email</button>
      </div>
    </form>

    <p class="back"><a routerLink="/login">Back to login</a></p>
  </div>
</section>
