# =================================================================
# BuildEase - Phase 2 configuration
# Secrets and environment-specific values come from ENVIRONMENT VARIABLES.
# Nothing secret is committed; defaults below are safe development values.
# =================================================================

# ---------------- Server ----------------
server.port:8080
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
enable.swagger.plugin=true

# ---------------- Database ----------------
# "update" keeps data between restarts (Phase 1 used "create" for the ordered tests).
# Every new column added in Phase 2 must be nullable or have a database default.
spring.jpa.hibernate.ddl-auto=update
# Keep column/table names exactly as written in the entities (userId, materialId, ErrorLogs).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.url=jdbc:mysql://localhost/appdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=examly
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
# SQL logging is off; application.log covers what matters.
spring.jpa.show-sql=false

# ---------------- Security ----------------
# Set JWT_SECRET (64+ random characters) in every shared environment.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000
# Comma-separated frontend origins; wildcard patterns allowed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,https://*.premiumproject.examly.io}
app.security.max-failed-logins=5
app.security.lock-minutes=15

# ---------------- Seeded primary admin (Manish) ----------------
# Created once if no admin exists; the password MUST be changed at first login.
app.admin.seed.username=admin
app.admin.seed.password=${ADMIN_SEED_PASSWORD:Admin@123}
app.admin.seed.email=${ADMIN_SEED_EMAIL:admin@buildease.local}
app.admin.seed.mobile=${ADMIN_SEED_MOBILE:9000000000}

# ---------------- OTP (Manish) ----------------
# live = send by email/SMS. dev = ALSO return the code in the API response for testing
# in workspaces without SMTP/SMS. Never use dev in a real deployment.
app.otp.delivery-mode=${OTP_DELIVERY_MODE:live}
app.otp.length=6
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-sends-per-hour=5
app.accounts.unverified-ttl-hours=24

# ---------------- Email (Manish) ----------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:BuildEase <no-reply@buildease.local>}

# ---------------- SMS via Twilio REST API (Manish) ----------------
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.sms.default-country-code=+91
# Twilio Verify (works on trial accounts): when set, SMS codes are generated, sent and checked by
# Twilio Verify instead of being sent as our own message. Leave empty to use the Messages API.
app.sms.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}

# ---------------- Uploads (Aakash) ----------------
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.upload.material-image.max-bytes=2097152

# ---------------- Pagination ----------------
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# ---------------- AI assistant: Google Gemini (final phase) ----------------
# The key is read ONLY from the environment (never commit it, never send it to the browser).
# Without a key the chatbot still answers from BuildEase data and built-in help; "Improve wording" is hidden.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
# gemini-flash-latest always points to Google's current Flash model; set GEMINI_MODEL to pin a version.
app.ai.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:15}
# Messages allowed per window (visitors are limited per IP, signed-in accounts per user)
app.ai.chat.anonymous-limit=${CHAT_ANON_LIMIT:15}
app.ai.chat.user-limit=${CHAT_USER_LIMIT:40}
app.ai.chat.window-minutes=5

# ---------------- Logging (see logback-spring.xml) ----------------
app.logging.dir=${LOG_DIR:logs}
# Email/SMS calls naturally take 1-3 s; only slower calls are flagged.
app.logging.slow-method-ms=3000
logging.level.com.examly.springapp=INFO